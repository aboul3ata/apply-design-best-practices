name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/skill.test.mjs
